# .gitlab-ci.yml
#
# CI pipeline for qeviz.
#
# - build-js      : rebuilds the JS/TS bundle on src/ changes (all branches)
# - test-py       : installs and tests the Python package on py/ changes
# - trigger-cranqe: inherited from cranqe CI template; fires on main when
#                   R/ or py/ sources change to redeploy both packages

include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'

stages:
  - build
  - test
  - .post

# ── JS/TS build ────────────────────────────────────────────────────────────────

build-js:
  stage: build
  image: node:20-alpine
  rules:
    - changes:
        - src/**/*
        - package.json
        - package-lock.json
        - vite.config.js
        - tsconfig.json
  script:
    - npm ci
    - npm run build
    - cp dist/qeviz.umd.js R/inst/qeviz.umd.js
    - cp dist/qeviz.umd.js py/qeviz/qeviz.umd.js
  artifacts:
    paths:
      - dist/
      - R/inst/qeviz.umd.js
      - py/qeviz/qeviz.umd.js
    expire_in: 1 week

# ── Python package tests ───────────────────────────────────────────────────────

test-py:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - py/**/*
  script:
    - pip install --quiet "py/[dev]"
    - python -m pytest py/tests/ -v

# ── cranqe deployment ──────────────────────────────────────────────────────────
# The trigger-cranqe job is defined in the included template (curl to cranqe's
# pipeline trigger API with FORCE_PACKAGES=${CI_PROJECT_NAME}).
# We override only the rules to restrict it to R/ or py/ changes on main,
# avoiding unnecessary cranqe rebuilds on JS-only commits.

trigger-cranqe:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - R/**/*
        - py/**/*
