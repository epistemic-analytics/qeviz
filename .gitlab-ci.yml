# .gitlab-ci.yml
#
# CI pipeline for qeviz.
#
# - build-js     : rebuilds the JS/TS bundle on src/ changes (all branches)
# - test-py      : installs and tests the Python package on py/ changes
# - trigger-cranqe    : deploys the R package via cranqe on main
# - trigger-cranqe-py : deploys the Python package via cranqe on main

include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'

stages:
  - build
  - test
  - deploy

# ── JS/TS build ────────────────────────────────────────────────────────────────

build-js:
  stage: build
  image: node:20-alpine
  rules:
    - changes:
        - src/**/*
        - package.json
        - package-lock.json
        - vite.config.js
        - tsconfig.json
  script:
    - npm ci
    - npm run build
    # Keep both language package bundles in sync with the JS build
    - cp dist/qeviz.umd.js R/inst/qeviz.umd.js
    - cp dist/qeviz.umd.js py/qeviz/qeviz.umd.js
  artifacts:
    paths:
      - dist/
      - R/inst/qeviz.umd.js
      - py/qeviz/qeviz.umd.js
    expire_in: 1 week

# ── Python package tests ───────────────────────────────────────────────────────

test-py:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - py/**/*
  script:
    - pip install --quiet "py/[dev]"
    - python -m pytest py/tests/ -v

# ── R package deployment (via cranqe) ─────────────────────────────────────────
# The trigger-cranqe.yml template expects:
#   CRANQE_PACKAGE_NAME  — name of the package in cranqe's packages.yaml
#   CRANQE_SOURCE_DIR    — subdirectory containing the package source

trigger-cranqe:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - R/**/*
  variables:
    CRANQE_PACKAGE_NAME: qeviz
    CRANQE_SOURCE_DIR: R

# ── Python package deployment (via cranqe) ────────────────────────────────────

trigger-cranqe-py:
  extends: trigger-cranqe
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - py/**/*
  variables:
    CRANQE_PACKAGE_NAME: qeviz
    CRANQE_SOURCE_DIR: py
