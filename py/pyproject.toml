[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qeviz"
version = "0.5.3"
description = "Interactive ENA / ONA network visualisations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pandas>=1.3"]

[project.optional-dependencies]
scipy  = ["scipy>=1.7"]
jupyter = ["ipython>=7.0"]
full   = ["scipy>=1.7", "ipython>=7.0"]
dev    = ["scipy>=1.7", "ipython>=7.0", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qeviz*"]

[tool.setuptools.package-data]
qeviz = ["qeviz.umd.js", "qeviz.umd.js.map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
