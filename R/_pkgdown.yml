template:
  bootstrap: 5

home:
  title: "qeviz — Interactive ENA / ONA Visualizations"
  description: >
    Generate interactive Epistemic Network Analysis (ENA) and Ordered Network
    Analysis (ONA) visualizations directly from rENA / tma model objects.
    Plots are self-contained HTML — no server required.

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [gitlab]
  components:
    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.com/epistemic-analytics/qe-packages/qeviz

reference:
  - title: "Build model data"
    desc: >
      Convert rENA / tma set objects or raw data frames into the qeviz
      ModelData format.
    contents:
      - qe_extract
      - qe_model_data
  - title: "Render"
    desc: >
      Produce HTML output from a ModelData list.
    contents:
      - qe_fragment
      - qe_html
      - qe_export_html
      - qe_plot

articles:
  - title: "Getting started"
    navbar: ~
    contents:
      - rena-demo
